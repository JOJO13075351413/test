<!DOCTYPE html>
<html>
<!-- 这里是注释内容 -->
<head>
    <meta charset="utf-8">
    <title>Login - OpenWrt</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            background: url('/luci-static/custom/img/login-background.png') no-repeat center center fixed;
            background-size: cover;
            font-family: "Segoe UI", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .brand-top-left {
            position: fixed;
            top: 18px;
            left: 18px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 10px;
            border-radius: 10px;
            background: none;
            -webkit-backdrop-filter: none;
            backdrop-filter: none;
            border: none;
        }

        .brand-top-left img {
            height: 36px;
            display: block;
        }

/* ===== 外层容器改为 flex 水平排列 ===== */
.login-wrapper {
    min-height: 100vh;
    display: flex;
    align-items: center;           /* 垂直居中，与卡片对齐 */
    justify-content: center;     /* 整体靠右 */
    padding: 0 20vw;
    box-sizing: border-box;
    gap: 12px;                     /* 图片与卡片之间的间距 */
}

/* ===== 左侧图片容器 ===== */
.login-left-image {
    flex-shrink: 0;                /* 防止图片被压缩 */
    display: flex;
    align-items: center;
    justify-content: center;
}

.login-left-image img {
    max-height: 400px;             /* 限制高度，可根据需要调整 */
    max-width: 400px;              /* 限制宽度 */
    width: auto;
    height: auto;
    display: block;
    border-radius: 14px;           /* 可选：与卡片圆角一致 */
}

        .login-card {
        width: 420px;
    max-width: 92vw;
    border-radius: 14px;
        background: #ffffff; 
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(237, 116, 29, 0.3); 
        box-shadow: 0 22px 48px rgba(0, 0, 0, 0.15),
                0 4px 12px rgba(0, 0, 0, 0.08);
        overflow: hidden;
        }


        .login-header {
            padding: 22px 26px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);  /* 半透明白色分隔线 */
            background: rgb(237, 116, 29);  /* 纯橙色 #ED741D */
        }

        .login-title {
            font-size: 24px;
            font-weight: 800;
            color: #e9edf5;
            line-height: 1.35;
        }

        .login-subtitle {
            margin-top: 6px;
            font-size: 12px;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: #e9edf5;
        }

        .login-body {
            padding: 20px 26px 26px;
        }

        .alert {
            margin: 0 0 10px;
            padding: 10px 12px;
            border-radius: 8px;
            background: rgba(191, 31, 31, .12);
            color: #ffd5d5;
            border: 1px solid rgba(242, 198, 198, .25);
            font-size: 14px;
        }

        .field {
            position: relative;
            margin-top: 12px;
        }

        .field:first-of-type {
            margin-top: 0;
        }

        .field-label {
            display: block;
            margin: 12px 0 8px;
            font-size: 13px;
            color: rgb(237, 116, 29);
        }

        .field-input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 44px 12px 12px;
            border-radius: 8px;
            background: rgb(237 116 29 / 12%);
            border: 1px solid rgb(237 116 29 / 43%);
            color: #1a1a1a;
            font-size: 14px;
            transition: border-color .2s, box-shadow .2s, background .2s;
        }

        .field-input::placeholder {
            color: rgba(230, 234, 242, .55);
        }

        .field-input:focus {
            outline: none;
            background: rgba(237, 116, 29, 0.08);
            border-color: #ed741d;
            box-shadow: 0 0 0 1px rgb(237 116 29 / 85%);
        }

        .field-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            opacity: .85;
            cursor: pointer;
            pointer-events: auto;
            user-select: none;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            margin-top: 18px;
            border: 0;
            border-radius: 10px;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            background: linear-gradient(180deg, #ED741D, #ED741D);
            box-shadow: 0 6px 18px rgb(234 144 9 / 35%);
            transition: transform .02s ease-in, filter .15s, box-shadow .15s;
        }

        .btn-login:hover {
            filter: brightness(1.07);
            box-shadow: 0 8px 22px rgba(61, 109, 255, .42);
        }

        .btn-login:active {
            transform: translateY(1px);
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        @media (max-width: 960px) {
            .login-wrapper {
                padding: 24px;
                justify-content: center;
            }

            .login-card {
                width: 92vw;
            }

            .brand-top-left {
                top: 12px;
                left: 12px;
                padding: 4px 8px;
            }

            .brand-top-left img {
                height: 30px;
            }
        }

        .brand-top-left img:first-child {
            height: 28px;
        }

        .brand-top-left img:last-child {
            height: 22px;
            margin-top: 2px;
        }
    </style>

    <script src="/luci-static/custom/js/toast.js"></script>
</head>

<body
    data-login-failed="<%= fuser and '1' or '0' %>"
    data-msg-empty="<%:请输入账号/密码%>"
    data-msg-login-failed="<%:登录失败，账号/密码不正确%>"
    data-msg-login-ok="<%:登录成功%>">
    <div class="brand-top-left" aria-hidden="true">
        <img src="/luci-static/custom/img/logo.svg" alt="Brand icon">
    </div>
    <div class="login-wrapper">
          
    <div class="login-left-image">
        <img src="/luci-static/custom/img/youren-cn.png" alt="左侧装饰图">
    </div>
            <div class="login-card">
            <div class="login-header">
                <div class="login-title"><%:有人工业实时网桥管理系统%></div>
                <div class="login-subtitle"><%:账号密码登录%></div>
            </div>
            <div class="login-body">
                <form id="login-form" method="post" action="<%=pcdata(FULL_REQUEST_URI)%>" novalidate>
                    <label class="field-label" for="user"><%:用户名%></label>
                    <div class="field">
                        <input id="user" class="field-input" type="text" name="luci_username" value="root" placeholder="Username">
                        <img class="field-icon" src="/luci-static/custom/img/user.svg" alt="" aria-hidden="true">
                    </div>
                    <label class="field-label" for="pass"><%:密码%></label>
                    <div class="field">
                        <input id="pass" class="field-input" type="password" name="luci_password" placeholder="Password">
                        <img id="toggle-pass" class="field-icon" src="/luci-static/custom/img/passwd.svg" alt="<%:切换密码可见性%>" style="cursor:pointer;">
                    </div>
                    <input class="btn-login" type="submit" value="<%:登录%>">
                </form>
            </div>
        </div>
    </div>

    <script>
        (function () {
            var passInput = document.getElementById('pass');
            var toggleIcon = document.getElementById('toggle-pass');
            var visible = false;

            if (toggleIcon) {
                toggleIcon.addEventListener('click', function () {
                    visible = !visible;
                    if (visible) {
                        passInput.type = 'text';
                        toggleIcon.src = '/luci-static/custom/img/passwd-visible.svg';
                    } else {
                        passInput.type = 'password';
                        toggleIcon.src = '/luci-static/custom/img/passwd.svg';
                    }
                });
            }

            var u = document.getElementById('user');
            if (u && u.value) { passInput && passInput.focus(); }
            else { u && u.focus(); }
        })();

        (function () {
            var form = document.getElementById('login-form');
            var user = document.getElementById('user');
            var pass = document.getElementById('pass');
            var body = document.body;
            var msgEmpty = body.getAttribute('data-msg-empty') || '请输入账号/密码';
            var msgLoginFailed = body.getAttribute('data-msg-login-failed') || '登录失败，账号/密码不正确';
            var msgLoginOk = body.getAttribute('data-msg-login-ok') || '登录成功';

            if (form) {
                form.addEventListener('submit', function (e) {
                    var u = (user && user.value || '').trim();
                    var p = (pass && pass.value || '').trim();
                    if (!u || !p) {
                        e.preventDefault();
                        showToast(msgEmpty, 'warn', 2000);
                    }
                });
            }

            var loginFailed = body.getAttribute('data-login-failed') === '1';
            if (loginFailed) {
                showToast(msgLoginFailed, 'error', 2200);
            }

            var usp = new URLSearchParams(location.search);
            if (usp.get('login') === 'ok') {
                showToast(msgLoginOk, 'success', 1600);
            }
        })();
    </script>
</body>

</html>
